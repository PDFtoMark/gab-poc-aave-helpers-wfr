name: pathprobe

on:
  workflow_dispatch:

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: dump layout
        run: |
          echo "RUNNER_WORKSPACE=$RUNNER_WORKSPACE"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          ls -la /home/runner/work | head -20
          ls -la /home/runner/work/_actions 2>&1 | head -20
